services:
  - type: web
    name: matchflow-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi:app bootstrap-db && flask --app wsgi:app seed-assessments && gunicorn --workers 3 --threads 2 --timeout 60 --access-logfile - wsgi:app
    healthCheckPath: /api/v1/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: '1'
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: matchflow-db
          property: connectionString
databases:
  - name: matchflow-db
    databaseName: matchflow
    user: matchflow
