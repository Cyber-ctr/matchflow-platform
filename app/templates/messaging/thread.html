{% extends 'base.html' %}{% block title %}Chat with {{ other.display_name }}{% endblock %}{% block content %}<section class="section"><div class="container chat-shell"><div class="chat-header"><a href="{{ url_for('messaging.index') }}">←</a><div><strong>{{ other.display_name }}</strong><span>{{ other.role|title }}</span></div></div><div class="message-list">{% for message in messages %}<div class="message {{ 'mine' if message.sender_id == current_user.id else 'theirs' }}"><p>{{ message.body }}</p><small>{{ message.created_at|dt }}</small></div>{else}<div class="empty-state"><p>Start the conversation.</p></div>{% endfor %}</div><form method="post" class="message-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><textarea name="body" rows="2" maxlength="4000" required placeholder="Write a professional message..."></textarea><button class="button">Send</button></form></div></section>{% endblock %}
