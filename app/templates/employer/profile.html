{% extends 'base.html' %}{% block title %}Business profile{% endblock %}{% block content %}<section class="page-hero"><div class="container"><p class="kicker">EMPLOYER</p><h1>Business profile</h1><p>A clear business profile builds trust with talent.</p></div></section><section class="section"><div class="container form-shell"><form method="post" class="form-stack card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="two-col"><label>Business name<input name="business_name" required value="{{ employer.business_name }}"></label><label>Industry<input name="industry" value="{{ employer.industry or '' }}"></label></div><label>Description<textarea name="description" rows="6">{{ employer.description or '' }}</textarea></label><div class="two-col"><label>City<input name="city" value="{{ employer.city or '' }}"></label><label>Phone<input name="phone" value="{{ employer.phone or '' }}"></label></div><div class="two-col"><label>Website<input type="url" name="website" value="{{ employer.website or '' }}"></label><label>Registration number<input name="registration_number" value="{{ employer.registration_number or '' }}"></label></div><button class="button">Save business profile</button></form></div></section>{% endblock %}
