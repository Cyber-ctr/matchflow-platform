{% extends 'base.html' %}{% block title %}Reset password{% endblock %}{% block content %}<section class="auth-section"><div class="auth-card"><h1>Reset your password</h1><p>Enter your account email. Configure SMTP in production to deliver the reset link.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" required></label><button class="button full">Generate reset link</button></form><div class="auth-links"><a href="{{ url_for('auth.login') }}">Back to login</a></div></div></section>{% endblock %}
