{% extends 'base.html' %}{% block title %}Log in{% endblock %}{% block content %}<section class="auth-section"><div class="auth-card"><img src="{{ url_for('static', filename='icons/logo-primary.png') }}" class="auth-logo" alt="MatchFlow"><h1>Welcome back</h1><p>Log in to manage your opportunities and matches.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><label class="checkbox"><input type="checkbox" name="remember" value="1"> Remember me</label><button class="button full" type="submit">Log in</button></form><div class="auth-links"><a href="{{ url_for('password_reset.forgot_password') }}">Forgot password?</a><span>·</span><a href="{{ url_for('auth.register') }}">Create account</a></div></div></section>{% endblock %}
