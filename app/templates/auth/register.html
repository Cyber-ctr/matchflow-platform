{% extends 'base.html' %}{% block title %}Join MatchFlow{% endblock %}{% block content %}<section class="auth-section"><div class="auth-card wide"><img src="{{ url_for('static', filename='icons/logo-primary.png') }}" class="auth-logo" alt="MatchFlow"><h1>Join MatchFlow</h1><p>Create a talent or employer account.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="role-grid"><label class="role-choice"><input type="radio" name="role" value="talent" checked data-role-switch><span><strong>I'm talent</strong><small>Find freelance work, jobs and apprenticeships.</small></span></label><label class="role-choice"><input type="radio" name="role" value="employer" data-role-switch><span><strong>I'm an employer</strong><small>Find and develop junior talent.</small></span></label></div><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="10" autocomplete="new-password"><small>At least 10 characters with mixed case.</small></label><label>Confirm password<input type="password" name="confirm_password" required autocomplete="new-password"></label><div data-register-role="talent"><label>Full name<input type="text" name="full_name"></label></div><div data-register-role="employer" class="hidden"><label>Business name<input type="text" name="business_name"></label></div><button class="button full" type="submit">Create my account</button></form><div class="auth-links"><span>Already have an account?</span><a href="{{ url_for('auth.login') }}">Log in</a></div></div></section>{% endblock %}
