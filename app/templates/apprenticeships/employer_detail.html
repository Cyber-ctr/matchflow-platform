{% extends 'base.html' %}{% block title %}Manage apprenticeship{% endblock %}{% block content %}<section class="page-hero"><div class="container"><p class="kicker">EMPLOYER</p><h1>Manage apprenticeship</h1><p>{{ apprenticeship.application.talent.full_name }} · {{ apprenticeship.application.job.title }}</p></div></section><section class="section"><div class="container form-shell"><form method="post" class="form-stack card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Status<select name="status"><option {% if apprenticeship.status == 'proposed' %}selected{% endif %}>proposed</option><option {% if apprenticeship.status == 'active' %}selected{% endif %}>active</option><option {% if apprenticeship.status == 'paused' %}selected{% endif %}>paused</option><option {% if apprenticeship.status == 'completed' %}selected{% endif %}>completed</option><option {% if apprenticeship.status == 'cancelled' %}selected{% endif %}>cancelled</option></select></label><div class="two-col"><label>Supervisor name<input name="supervisor_name" value="{{ apprenticeship.supervisor_name or '' }}"></label><label>Supervisor phone<input name="supervisor_phone" value="{{ apprenticeship.supervisor_phone or '' }}"></label></div><label>Allowance (FCFA)<input type="number" name="allowance" value="{{ apprenticeship.allowance or '' }}"></label><label>Objectives<textarea name="objectives" rows="5">{{ apprenticeship.objectives or '' }}</textarea></label><label>Terms<textarea name="terms" rows="5">{{ apprenticeship.terms or '' }}</textarea></label><button class="button">Save apprenticeship</button></form></div></section>{% endblock %}
