{% extends 'base.html' %}{% block title %}Notifications{% endblock %}{% block content %}<section class="page-hero"><div class="container"><p class="kicker">NOTIFICATIONS</p><h1>Your updates</h1></div></section><section class="section"><div class="container"><div class="notification-list">{% for item in notifications %}<a href="{{ item.link or '#' }}" class="notification"><strong>{{ item.title }}</strong><p>{{ item.body }}</p><small>{{ item.created_at|dt }}</small></a>{else}<div class="empty-state"><h3>You're all caught up.</h3></div>{% endfor %}</div></div></section>{% endblock %}
